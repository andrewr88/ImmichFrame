name: Build and Publish custom image to GHCR

on:
  push:
    branches:
      - custom  # Only this fork's working branch; upstream tags stay with build-docker.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# The default token is broad; this job only reads the repo and writes the package.
permissions:
  contents: read
  packages: write

jobs:
  publish_custom_image:
    # workflow_dispatch can be started against any ref, and type=raw ignores the
    # ref entirely, so a dispatch from main would repoint latest at a non-custom
    # build. latest must only ever track custom: skip the job on any other ref.
    if: github.ref == 'refs/heads/custom'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # amd64 is native on the runner; only the foreign arch needs a binfmt handler.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the image name for us: github.repository is andrewr88/ImmichFrame,
      # but GHCR only accepts lowercase image names.
      - name: Extract Docker metadata (${{ env.IMAGE_NAME }})
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # No version numbers: latest tracks the branch, sha-<short> pins one commit
          # so a bad deploy can be rolled back to an exact image.
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build and push Docker image for the two platforms this fork deploys to
      - name: Build and push Docker image (${{ env.IMAGE_NAME }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The Dockerfile feeds VERSION to -p:AssemblyVersion=, which MSBuild only
          # accepts as major.minor.build.revision, so this must stay purely numeric.
          build-args: |
            VERSION=0.0.${{ github.run_number }}.0
