General:
  AuthenticationSecret: null
  DownloadImages: false
  RenewImagesDuration: 30
  Webcalendars:
    - calendarurl
  RefreshAlbumPeopleInterval: 12
  PhotoDateFormat: MM/dd/yyyy
  ImageLocationFormat: 'City,State,Country'
  WeatherApiKey: ''
  UnitSystem: imperial
  WeatherLatLong: '40.730610,-73.935242'
  Webhook: null
  Language: en
  Interval: 45
  TransitionDuration: 2
  ShowClock: true
  ClockFormat: 'hh:mm'
  ClockDateFormat: 'eee, MMM d'
  ShowProgressBar: true
  ShowPhotoDate: true
  ShowImageDesc: true
  ShowPeopleDesc: true
  ShowAlbumName: true
  ShowImageLocation: true
  PrimaryColor: '#f5deb3'
  SecondaryColor: '#000000'
  Style: none
  BaseFontSize: 17px
  ShowWeatherDescription: true
  WeatherIconUrl: 'https://openweathermap.org/img/wn/{IconId}.png'
  ImageZoom: true
  ImagePan: false
  ImageFill: false
  PlayAudio: false
  Layout: splitview
Accounts:
  - ImmichServerUrl: REQUIRED
    # Exactly one of ApiKey or ApiKeyFile must be set.
    ApiKey: "super-secret-api-key"
    # ApiKeyFile: "/path/to/api.key"

    ImagesFromDate: null
    ShowMemories: false
    ShowFavorites: false
    ShowArchived: false
    ShowVideos: false
    ImagesFromDays: null
    ImagesUntilDate: '2020-01-02'
    Rating: null
    Albums:
      - UUID
    ExcludedAlbums:
      - UUID
    People:
      - UUID
    Tags:
      - Vacation
      - Travel/Europe

# Optional. Serve more than one configuration from a single ImmichFrame instance.
# Each profile is reached at its own URL - /kitchen, /bedroom - and only names the
# settings it overrides; everything else is inherited from above.
# Nested sections such as General are merged key by key, but anything else replaces
# the value above outright, lists included: a profile that names Accounts replaces the
# whole account list rather than adding to it.
# Names may use A-Z, a-z, 0-9, '-' and '_' (1-64 characters). 'api', 'static',
# 'swagger' and 'default' are reserved.
# Profiles:
#   kitchen:
#     General:
#       Interval: 20
#       PrimaryColor: '#ff8800'
#       # Overrides the AuthenticationSecret above for this profile only.
#       # Set it to null to leave this profile unauthenticated.
#       AuthenticationSecret: 'kitchen-secret'
