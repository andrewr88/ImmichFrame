<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<!-- iOS PWA Meta Tags -->
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="ImmichFrame" />
	<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
	<!-- Android/Desktop PWA -->
	<link rel="manifest" href="/manifest.webmanifest" />
	<meta name="theme-color" content="#000000" />
	%sveltekit.head%
</head>

<!-- Off rather than "hover": loading a frame route is not free of side effects. The loaders
     re-point the profile, and with it the bearer header and the secret posted to the service
     worker, and they replace the running configuration - so preloading a link to another profile
     on hover would switch this frame over to it without navigating there. -->
<body data-sveltekit-preload-data="off">
	<div style="display: contents">%sveltekit.body%</div>
	<script>
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
				navigator.serviceWorker
					.register('/pwa-service-worker.js')
					.then(() => console.log('PWA service worker registered'))
					.catch(console.error);
			});
		}
	</script>
</body>

</html>
